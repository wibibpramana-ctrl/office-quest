name: Perbarui backend


on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
    workflow_dispatch:


jobs:
  muat-ulang:
    runs-on: ubuntu-latest
    steps:
      - name: Muat ulang webapp PythonAnywhere
        run: |
          curl -s -f -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            "https://www.pythonanywhere.com/api/v1/user/Wibi/websites/Wibi.pythonanywhere.com/reload/" \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_API_TOKEN }}"
      - name: Tunggu server nyala lagi
        run: sleep 30
      - name: Periksa /sehat
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -s -f --max-time 60 https://Wibi.pythonanywhere.com/sehat; then
              echo "Server nyala (percobaan ke-$i)."
              exit 0
            fi
            echo "Belum nyala (percobaan ke-$i), tunggu 20 detik..."
            sleep 20
          done
          echo "Server tidak nyala setelah 6 percobaan."
          exit 1
